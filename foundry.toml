[profile.default]
  # Remappings are listed explicitly because newer forge versions auto-detect context-scoped remappings for nested
  # dependencies, which the hardhat-foundry plugin rejects.
  auto_detect_remappings = false
  remappings = [
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
    ]
  src = 'contracts'
  out = 'out'
  libs = ['node_modules', 'lib']
  test = 'test'
  cache_path  = 'cache_forge'
  evm_version = "cancun"
  optimizer = true
  optimizer_runs = 200
  solc_version = "0.8.26"
  verbosity = 3

[profile.ci]
  fuzz = { runs = 500 }
  invariant = { runs = 100 }

[profile.deploy]
  # Matches the compiler settings of the CompoundGovernor implementation deployed on mainnet.
  optimizer_runs = 800

[profile.lite]
  fuzz = { runs = 50 }
  invariant = { runs = 10 }
  # Speed up compilation and tests during development.
  optimizer = false

[rpc_endpoints]
  sepolia = "${SEPOLIA_RPC_URL}"

[invariant]
  call_override = false
  depth = 100
  dictionary_weight = 80
  fail_on_revert = false
  include_push_bytes = true
  include_storage = true
  optimizer = false
  runs = 25

[fmt]
  bracket_spacing = false
  int_types = "long"
  line_length = 120
  multiline_func_header = "attributes_first"
  number_underscore = "thousands"
  quote_style = "double"
  single_line_statement_blocks = "multi"
  tab_width = 4
  wrap_comments = true
  ignore = [
    "contracts/Comp.sol",
    "contracts/GovernorBravo*.sol",
    "contracts/SafeMath.sol",
    "contracts/Timelock.sol",
    "contracts/testnet/TestnetTimelock.sol",
    "contracts/test/GovernorAlpha.sol",
    "contracts/test/Multicall.sol"
  ]
